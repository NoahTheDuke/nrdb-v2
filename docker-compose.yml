version: '2'
services:
  db:
    image: postgres
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
  cardimages:
    image: registry.gitlab.com/project-nisei/nrdb-v2/nrdb-card-images:latest
  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/myapp
      - ../netrunner-data/:/netrunner-data
    volumes_from:
      - cardimages:ro
    ports:
      - "3000:3000"
    depends_on:
      - db
