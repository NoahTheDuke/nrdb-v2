# https://medium.com/weareevermore/set-up-gitlab-ci-for-rails-applications-cf0117128bce

image: ruby:2.5.3

variables:
  POSTGRES_DB: test_db
  POSTGRES_USER: runner
  POSTGRES_PASSWORD: ""

services:
  - postgres:10.1

before_script: 
  - apt-get update -qq && apt-get install -y -qq sqlite3 libsqlite3-dev nodejs postgresql postgresql-contrib libpq-dev cmake ruby-rspec-core
  - gem install bundler --no-document
  - bundle install
  - cp config/database.ci.yml config/database.yml
  - bundle exec rails db:create RAILS_ENV=test
  - bundle exec rails db:migrate RAILS_ENV=test

test:
  script:
    - rspec spec