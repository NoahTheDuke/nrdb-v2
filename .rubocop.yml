AllCops:
  TargetRubyVersion: 2.5
  CacheRootDirectory: ./tmp/cache
  Exclude:
    - 'config/deploy.rb'
    - 'config/deploy/**/*'
    - 'db/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'
    - 'node_modules/**/*'

Metrics/LineLength:
  Max: 88

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma
